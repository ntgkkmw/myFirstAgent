[project]
name = "codex-mas"
version = "0.1.0"
description = "Production-grade multi-agent system powered by pydantic_ai"
requires-python = ">=3.10"
dependencies = [
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "openai>=1.30",
  "pydantic-ai[openai]>=0.1.0",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
  "pre-commit>=3.7",
  "detect-secrets>=1.4",
]

[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["packages"]
include = ["codex_mas*", "codex-mas*"]

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100
select = ["E", "F", "I", "UP", "B"]

